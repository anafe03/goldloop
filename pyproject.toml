[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldloop"
version = "0.1.0"
description = "Golden-set evals for LLM agents: regression gates, stability, and a closed improvement loop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3.49"]
llm = ["langchain>=0.3", "langchain-core>=0.3.49"]
dev = ["pytest>=8"]

[project.scripts]
goldloop = "goldloop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
